# Kanagawa Dragon for zsh-patina
# Scope mapping based on the official Kanagawa Dragon palette.

"comment" = "#737c73"
"punctuation.definition.comment.begin" = "#737c73"
"source" = "#c5c9c5"
"variable.function" = { foreground = "#8ba4b0", bold = true }
"entity.name.function" = { foreground = "#8ba4b0", bold = true }
"meta.function-call" = "#8ba4b0"
"meta.function-call.arguments" = "#c8c093"
"string" = "#87a987"
"punctuation.definition.string" = "#87a987"
"constant.character.escape" = { foreground = "#b6927b", bold = true }
"variable" = "#c5c9c5"
"variable.other" = "#c4b28a"
"variable.language" = "#c4746e"
"variable.parameter" = "#a292a3"
"variable.parameter.option" = { foreground = "#949fb5", bold = true }
"punctuation.definition.variable" = "#8ea4a2"
"meta.group.expansion.parameter" = "#8ea4a2"
"meta.group.expansion.arithmetic" = "#a292a3"
"meta.group.expansion.command" = "#8ba4b0"
"meta.group.expansion.history" = { foreground = "#b98d7b", bold = true }
"variable.language.tilde" = { foreground = "#8992a7", bold = true }
"constant" = "#a292a3"
"constant.numeric" = { foreground = "#a292a3", bold = true }
"keyword" = { foreground = "#8992a7", bold = true }
"keyword.control" = { foreground = "#8992a7", bold = true }
"keyword.control.case.item" = "#949fb5"
"precommand" = { foreground = "#8ea4a2", bold = true }
"keyword.operator" = "#b6927b"
"keyword.operator.logical" = { foreground = "#c4b28a", bold = true }
"keyword.operator.assignment" = "#b6927b"
"keyword.operator.arithmetic" = "#a292a3"
"keyword.operator.regexp" = "#b6927b"
"keyword.operator.logical.continue" = "#949fb5"
"punctuation" = "#949fb5"
"punctuation.section" = "#8ea4a2"
"punctuation.section.parens" = "#8ea4a2"
"punctuation.section.expansion" = "#8ea4a2"
"support" = { foreground = "#949fb5", bold = true }
"keyword.control.regexp" = "#949fb5"
"meta.regexp" = "#b6927b"
"storage" = { foreground = "#8992a7", bold = true }
"storage.modifier" = "#a292a3"
"invalid" = { foreground = "#e46876", bold = true }
"dynamic.callable" = { foreground = "#8ba4b0", bold = true }
"dynamic.callable.command" = { foreground = "#8ba4b0", bold = true }
"dynamic.callable.function" = { foreground = "#8ea4a2", bold = true }
"dynamic.callable.builtin" = { foreground = "#949fb5", bold = true }
"dynamic.callable.alias" = { foreground = "#87a987", bold = true }
"dynamic.callable.missing" = { foreground = "#e46876", bold = true }
"dynamic.path" = { foreground = "#87a987", underline = true }
"dynamic.path.file" = { foreground = "#87a987", underline = true }
"dynamic.path.directory" = { foreground = "#8ea4a2", underline = true, bold = true }
"dynamic.path.file.partial" = { foreground = "#8a9a7b", underline = true }
"dynamic.path.directory.partial" = { foreground = "#7aa89f", underline = true, bold = true }
"meta" = "#c5c9c5"

[metadata]
extends = "kanagawa"

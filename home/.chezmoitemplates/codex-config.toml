{{- $mac := eq .chezmoi.os "darwin" -}}
# Merged into Codex's own state ([projects], [hooks.state], marketplaces, nux
# counters) by private_dot_codex/modify_private_config.toml.
{{- if $mac }}
notify = ["{{ .chezmoi.homeDir }}/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
{{- end }}
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
model_provider = "bifrost"
model_catalog_json = "{{ .chezmoi.homeDir }}/.codex/bifrost_models.json"
sandbox_mode = "danger-full-access"
approval_policy = "never"
model_verbosity = "low"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = false
web_search = "live"
service_tier = "default"

[model_providers.azure]
name = "Azure OpenAI"
base_url = "https://suzuka-ai-garage-si-32cbd92e.openai.azure.com/openai/v1"
env_key = "AZURE_OPENAI_API_KEY"
wire_api = "responses"

# Default inference gateway; Azure credentials stay on Bifrost.
[model_providers.bifrost]
name = "Bifrost"
base_url = "https://bifrost.shau.me/openai/v1"
env_key = "BIFROST_VIRTUAL_KEY"
http_headers = { "x-codex-route" = "azure", "x-bf-lh-harness" = "codex" }
wire_api = "responses"
supports_websockets = false

[features]
hooks = true
secret_auth_storage = true
# Keep shell snapshots disabled to reduce overhead.
shell_snapshot = false
# Plugins and computer use only help on the Mac desktop.
plugins = {{ $mac }}
remote_plugin = false
apps = false
computer_use = {{ $mac }}

[sandbox_workspace_write]
network_access = true

[tui]
alternate_screen = "never"
animations = false
status_line = ["model-with-reasoning", "current-dir", "hostname", "git-branch", "context-remaining", "estimated-thread-cost"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "git-branch", "estimated-thread-cost", "model-with-reasoning"]
resume_cwd = "session"
screen_reader_detection_done = true

[mcp_servers.openaiDeveloperDocs]
enabled = false
url = "https://developers.openai.com/mcp"

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

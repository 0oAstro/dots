unbind-key -a

# Send a literal ESC byte while CSI-u extended keys are on; -H skips tmux's
# key re-encoding, which Neovim needs.
bind-key -n Escape send-keys -H 1b

bind-key C-a send-prefix
bind-key r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux reloaded"
bind-key -n M-r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux reloaded"

bind-key c new-window -c "#{pane_current_path}"
bind-key -n M-t new-window -c "#{pane_current_path}"
bind-key -n M-w if-shell -F '#{==:#{window_panes},1}' 'kill-window' 'kill-pane'
bind-key , command-prompt -I "#W" "rename-window '%%'"
bind-key & confirm-before -p "kill window #W? (y/n)" kill-window
bind-key l last-window
bind-key n next-window
bind-key p previous-window

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"
bind-key x if-shell -F '#{==:#{pane_current_command},zsh}' 'kill-pane' 'confirm-before -p "kill pane #P? (y/n)" kill-pane'
bind-key z resize-pane -Z
bind-key Up select-pane -U
bind-key Down select-pane -D
bind-key Left select-pane -L
bind-key Right select-pane -R

bind-key [ copy-mode
bind-key ] paste-buffer
bind-key -n M-v run-shell "$HOME/.config/tmux/scripts/paste-image-from-monaco.sh"

bind-key -T copy-mode Enter send-keys -X cancel
bind-key -T copy-mode-vi Enter send-keys -X cancel

bind-key -n M-1 select-window -t :=1
bind-key -n M-2 select-window -t :=2
bind-key -n M-3 select-window -t :=3
bind-key -n M-4 select-window -t :=4
bind-key -n M-5 select-window -t :=5
bind-key -n M-6 select-window -t :=6
bind-key -n M-7 select-window -t :=7
bind-key -n M-8 select-window -t :=8
bind-key -n M-9 select-window -t :=9
bind-key -n M-0 select-window -t :=10
bind-key -n M-Left previous-window
bind-key -n M-Right next-window

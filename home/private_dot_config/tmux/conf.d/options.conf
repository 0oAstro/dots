set-option -g prefix C-a
unbind-key C-b

# Truecolor setup for Ghostty without forcing apps onto tmux-direct palettes.
set -g default-terminal "tmux-256color"
# mosh presents itself as xterm-256color, but the Ghostty client behind it
# supports extkeys, which keeps Shift-Enter and friends distinct through tmux.
set -g terminal-features "xterm-ghostty:RGB:clipboard:focus:title:extkeys,xterm-256color:RGB:focus:title:extkeys"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'
set -g allow-rename off

setw -g mode-keys emacs
set -s escape-time 200
set -g history-limit 100000

set -g extended-keys on
set -g extended-keys-format csi-u
setw -g xterm-keys on

set -g mouse on
set -g focus-events on
setw -g aggressive-resize on

set -g set-titles on
set -g set-titles-string "#h: #W"

set -g monitor-activity on
set -g activity-action none

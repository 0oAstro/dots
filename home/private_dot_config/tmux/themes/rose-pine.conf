# Rosé Pine theme.
# Palette copied from rose-pine/tmux, main variant.

# Palette
set -g @rose_pine_base '#191724'
set -g @rose_pine_surface '#1f1d2e'
set -g @rose_pine_overlay '#26233a'
set -g @rose_pine_muted '#6e6a86'
set -g @rose_pine_subtle '#908caa'
set -g @rose_pine_text '#e0def4'
set -g @rose_pine_love '#eb6f92'
set -g @rose_pine_gold '#f6c177'
set -g @rose_pine_rose '#ebbcba'
set -g @rose_pine_pine '#31748f'
set -g @rose_pine_foam '#9ccfd8'
set -g @rose_pine_iris '#c4a7e7'
set -g @rose_pine_hl_low '#21202e'
set -g @rose_pine_hl_med '#403d52'
set -g @rose_pine_hl_high '#524f67'

# Status bar, matching rose-pine/tmux defaults.
set -g status on
set -g status-style "fg=#31748f,bg=#191724"
set -g status-left-length 200
set -g status-right-length 200
set -g status-justify left
set -g status-left ""
set -g status-right "#[fg=#9ccfd8]#H"

# Messages.
set -g message-style "fg=#6e6a86,bg=#191724"
set -g message-command-style "fg=#191724,bg=#f6c177"

# Panes.
set -g pane-border-style "fg=#524f67"
set -g pane-active-border-style "fg=#f6c177"
set -g display-panes-active-colour "#e0def4"
set -g display-panes-colour "#f6c177"

# Windows.
setw -g window-status-style "fg=#c4a7e7,bg=#191724"
setw -g window-status-activity-style "fg=#191724,bg=#ebbcba"
setw -g window-status-current-style "fg=#f6c177,bg=#191724"
setw -g window-status-separator "  "

# Modes / clock.
setw -g clock-mode-colour "#eb6f92"
setw -g mode-style "bg=#403d52,fg=#e0def4"

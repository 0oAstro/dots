# Tools every machine gets. Add new tools here unless they only exist on one OS
# (macos.toml, linux.toml) or belong to the agent setup (ai.toml).

[tools]
node = "lts"
python = "latest"
go = "latest"
rust = "stable"
bun = "latest"
uv = "latest"
pnpm = "latest"
"aqua:Kitware/CMake" = "latest"

chezmoi = "latest"
"aqua:cli/cli" = "latest"
"aqua:dandavison/delta" = "latest"
"aqua:git-lfs/git-lfs" = "latest"

"aqua:neovim/neovim" = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"cargo:zsh-patina" = "latest"
"cargo:pokeget" = "latest"

"aqua:BurntSushi/ripgrep" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:sharkdp/bat" = "latest"
"cargo:eza" = "latest"
"aqua:jqlang/jq" = "latest"
# Glow 3 renders "auto" as dark for Markdown (charmbracelet/glow#1022, fix in PR #1023).
# Stay on the 2.x line until the fix ships; patch releases still arrive.
"aqua:charmbracelet/glow" = "2"
"aqua:sharkdp/hyperfine" = "latest"
ffmpeg = "latest"
# aqua's dust entry picks the Intel build on Apple silicon.
"github:bootandy/dust" = "latest"
"aqua:amir20/dtop" = "latest"
"aqua:fastfetch-cli/fastfetch" = "latest"
"go:github.com/maaslalani/fast" = "latest"
"github:AlDanial/cloc" = { version = "latest", asset_pattern = "cloc-{{ version }}.pl", bin = "cloc" }

# chezmoi links the plugins into ~/.docker/cli-plugins.
"aqua:docker/cli" = "latest"
"aqua:docker/buildx" = "latest"
"aqua:docker/compose" = "latest"

"github:theseus-rs/postgresql-binaries" = { version = "latest", filter_bins = "psql" }
"github:jorgerojas26/lazysql" = "latest"

aws-cli = { version = "latest", symlink_bins = "true" }
# The registry already allows prerelease dependencies; repeating it breaks uv.
# pymsalruntime, a macOS dependency, has no CPython 3.15 wheels yet.
azure-cli = { version = "latest", python = "3.14" }
azd = "latest"
# gcloud rejects the system Python (3.9 on macOS and Amazon Linux); CLOUDSDK_PYTHON
# below points its installer and runtime at mise's.
gcloud = { version = "latest", depends = ["python"] }
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = ["undici"] }
# Neon's standalone macOS build is x86_64-only; the npm package runs anywhere.
"npm:neonctl" = "latest"
# Cloudflare's cf CLI; caddy/cloudflare-sync.py in the docker repo calls it.
# The npm `latest` tag still points to 0.15, which predates `dns records`. The 1.0
# line ships only as betas, so follow the newest version, prereleases included.
"npm:cf" = { version = "latest", prerelease = true }

"aqua:rclone/rclone" = "latest"
"aqua:FiloSottile/age" = "latest"
"aqua:bitwarden/clients" = "2026.8.0"  # 2026.9 key-id backfill 404s on Vaultwarden 1.37.3
"github:pimalaya/himalaya" = "latest"
# Google Workspace CLI (Drive, Gmail, ...). Auth: `gws auth setup` / `gws auth login`.
"github:googleworkspace/cli" = { version = "latest", bin = "gws" }

[env]
CLOUDSDK_PYTHON = "{{ env.HOME }}/.local/share/mise/installs/python/latest/bin/python3"

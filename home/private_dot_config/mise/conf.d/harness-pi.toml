# Pi. Settings live in ~/.pi; pi-global-tools.toml holds its local extensions.

[tools]
# Pi extensions: pi-subagents for subagents, pi-monitor for long jobs, pi-vcc for compaction.
"npm:@tintinweb/pi-subagents" = { version = "latest", npm_args = "--legacy-peer-deps" }
"npm:@cahalane/pi-monitor" = { version = "latest", npm_args = "--legacy-peer-deps" }
"npm:@sting8k/pi-vcc" = { version = "latest", npm_args = "--legacy-peer-deps" }
# REA (reverse engineering MCP). Pi registers it in ~/.pi/agent/mcp.json and
# loads its skill as a settings package. Its native analysis drives Ghidra.
"npm:rea-agents" = "latest"

# Pi from npm, run by Bun. The prebuilt aqua binary reaches the prompt in about
# 420ms; the same release under Bun takes about 210ms. postinstall swaps the
# npm bin link for a Bun launcher.
[tools."npm:@earendil-works/pi-coding-agent"]
version = "latest"
depends = ["bun"]
postinstall = '''
set -eu
rm -f "$MISE_TOOL_INSTALL_PATH/bin/pi"
printf '#!/bin/sh\nexec "%s/.local/share/mise/installs/bun/latest/bin/bun" "%s/lib/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" "$@"\n' "$HOME" "$MISE_TOOL_INSTALL_PATH" > "$MISE_TOOL_INSTALL_PATH/bin/pi"
chmod +x "$MISE_TOOL_INSTALL_PATH/bin/pi"
'''

# REA accepts Ghidra 12.1.x only. Releases ship no macOS or Linux arm64
# decompiler, so postinstall builds it with JDK 21 (gcc/clang required).
[tools."github:NationalSecurityAgency/ghidra"]
version = "Ghidra_12.1"
depends = ["java"]
postinstall = '''
set -eu
cd "$MISE_TOOL_INSTALL_PATH/support/gradle"
JAVA_HOME="$HOME/.local/share/mise/installs/java/zulu-21" ./gradlew --no-daemon -q buildNatives
'''

# Emil Kowalski's design and motion skills. The repo has no releases, so each
# version is one commit, named <date>.<time>.<sha> so that newer sorts later.
# Pi loads them through the skills list in ~/.pi/agent/settings.json.
[tools."http:emil-skills"]
version = "latest"
url = '{% raw %}https://github.com/emilkowalski/skills/archive/{{ version | split(pat=".") | last }}.tar.gz{% endraw %}'
version_list_url = "https://github.com/emilkowalski/skills/commits/HEAD.atom"
version_expr = 'reverse(map(split(body, "<entry>")[1:], { let sha = #[indexOf(#, "Grit::Commit/") + 13:indexOf(#, "Grit::Commit/") + 25]; let date = #[indexOf(#, "<updated>") + 9:indexOf(#, "<updated>") + 28]; replace(date[0:10], "-", "") + "." + replace(date[11:19], ":", "") + "." + sha }))'
strip_components = 1
bin_path = "bin"

# Matt Pocock's skills, versioned the same way as http:emil-skills. Pi loads
# only the ones that ~/.pi/agent/settings.json names.
[tools."http:mattpocock-skills"]
version = "latest"
url = '{% raw %}https://github.com/mattpocock/skills/archive/{{ version | split(pat=".") | last }}.tar.gz{% endraw %}'
version_list_url = "https://github.com/mattpocock/skills/commits/HEAD.atom"
version_expr = 'reverse(map(split(body, "<entry>")[1:], { let sha = #[indexOf(#, "Grit::Commit/") + 13:indexOf(#, "Grit::Commit/") + 25]; let date = #[indexOf(#, "<updated>") + 9:indexOf(#, "<updated>") + 28]; replace(date[0:10], "-", "") + "." + replace(date[11:19], ":", "") + "." + sha }))'
strip_components = 1
bin_path = "bin"

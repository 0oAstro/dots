# Coding agents. Their configs live under ~/.claude, ~/.codex and ~/.pi.
# Server-only harnesses (prime, grok, cursor) are in server.toml.

[tools]
claude-code = "latest"
"aqua:earendil-works/pi" = "latest"
"aqua:vercel-labs/agent-browser" = "latest"
# Pi's subagent worktree hook (~/.pi/agent/scripts/setup-worktree-cow.mjs) runs `wt`.
"aqua:max-sixty/worktrunk" = "latest"

# On Linux, Codex's app-server daemon runs ~/.codex/packages/standalone/current,
# which chezmoi links to this tool's `latest` install. Restart it on upgrade.
[tools."aqua:openai/codex"]
version = "latest"
postinstall = '''
[ "$(uname)" = Linux ] || exit 0
codex=$HOME/.codex/packages/standalone/current/codex
"$codex" app-server daemon restart >/dev/null 2>&1 ||
  "$codex" app-server daemon start >/dev/null 2>&1 || true
'''

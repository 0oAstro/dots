# Coding agents. Their configs live under ~/.claude, ~/.codex, ~/.pi and ~/.grok.

[tools]
claude-code = "latest"
"aqua:earendil-works/pi" = "latest"
"aqua:vercel-labs/agent-browser" = "latest"
# Pi's subagent worktree hook (~/.pi/agent/scripts/setup-worktree-cow.mjs) runs `wt`.
"aqua:max-sixty/worktrunk" = "latest"

# On Linux, Codex's app-server daemon runs ~/.codex/packages/standalone/current,
# which chezmoi links to this tool's `latest` install. Restart it on upgrade.
[tools."aqua:openai/codex"]
version = "latest"
postinstall = '''
[ "$(uname)" = Linux ] || exit 0
codex=$HOME/.codex/packages/standalone/current/codex
"$codex" app-server daemon restart >/dev/null 2>&1 ||
  "$codex" app-server daemon start >/dev/null 2>&1 || true
'''

# Prime agent, installed as `prime`. The tarball ships cli.js without the exec bit.
[tools."http:prime-agent"]
version = "latest"
url = "https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/releases/v{{ version }}/prime-agent-{{ version }}.tgz"
version_list_url = "https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/stable"
version_regex = 'v?([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)'
checksum_url = "https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/releases/v{{ version }}/SHA256SUMS"
strip_components = 1
bin_path = "bin"
postinstall = '''
cd "$MISE_TOOL_INSTALL_PATH" \
  && npm install --omit=dev --min-release-age=1 \
  && chmod +x dist/bundle/cli.js \
  && mkdir -p bin \
  && ln -sf ../dist/bundle/cli.js bin/prime
'''

# Grok Build. `grok update` is off (~/.grok/config.toml); mise owns upgrades.
[tools."http:grok"]
version = "latest"
version_list_url = "https://x.ai/cli/stable"
bin = "grok"
platforms.macos-arm64.url = "https://x.ai/cli/grok-{{ version }}-macos-aarch64.gz"
platforms.linux-arm64.url = "https://x.ai/cli/grok-{{ version }}-linux-aarch64.gz"
platforms.linux-x64.url = "https://x.ai/cli/grok-{{ version }}-linux-x86_64.gz"

[highlighting]
theme = "file:~/.config/zsh/config/plugins/zsh-patina-kanagawa.toml"

# Partial: style existing path prefixes while typing, not only complete paths.
dynamic = { callables = true, paths = "partial" }

max_line_length = 20000

# Applies to multi-line commands only; a single line cannot be aborted midway.
timeout_ms = 500

name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays: also runs the slow fresh-Mac job

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: sudo apt-get install -y zsh
        if: runner.os == 'Linux'
      - run: mise run check

  # A machine from nothing: install.sh bootstraps, Ansible provisions the
  # runner as a host it has never seen, chezmoi applies. A second run must
  # change nothing. ai is off: the agent repos are private.
  fresh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, group: desktops}
          - {os: macos-latest, group: macs}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The Mac installs every cask in the Brewfile, so it runs weekly or on demand.
    if: matrix.os != 'macos-latest' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      DOTS_REPO: file://${{ github.workspace }}
      DOTS_GROUP: ${{ matrix.group }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SWITCHES: '{"chezmoi_data": {"ai": false, "server": false}}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: First run
        run: sh install.sh -e "$SWITCHES" 2>&1 | tee first.log
      - name: Second run changes nothing
        run: |
          sh install.sh -e "$SWITCHES" 2>&1 | tee second.log
          grep -E 'changed=0 +unreachable=0 +failed=0' second.log
      - name: The machine ended up as configured
        run: |
          shell=$( [ "$RUNNER_OS" = macOS ] && dscl . -read ~ UserShell | cut -d' ' -f2 || getent passwd "$USER" | cut -d: -f7 )
          echo "login shell: $shell"; case $shell in */zsh) ;; *) exit 1 ;; esac
          ~/.local/bin/mise exec chezmoi@latest -- chezmoi status | tee status.log
          [ ! -s status.log ]

  # Each distro's package names, repos and login shell, installed for real.
  # Containers have no systemd, so tasks tagged service are skipped.
  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "amazonlinux:2023", prep: "dnf -y install python3 sudo"}
          - {image: "fedora:latest", prep: "dnf -y install python3 python3-libdnf5 sudo"}
          - {image: "debian:stable", prep: "apt-get update && apt-get install -y python3 sudo"}
          - {image: "archlinux:latest", prep: "pacman -Sy --noconfirm python sudo"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Start ${{ matrix.image }}
        run: |
          docker run -d --name ci-target "${{ matrix.image }}" sleep infinity
          docker exec ci-target sh -c "${{ matrix.prep }}"
      - run: mise run ansible:deps
      - name: Provision twice; the second run must change nothing
        working-directory: ansible
        run: |
          printf 'all:\n  children:\n    desktops:\n      hosts:\n        ci-target:\n          ansible_connection: community.docker.docker\n' >ci-inventory.yml
          run() {
            mise exec -- ansible-playbook site.yml -i inventory.yml -i ci-inventory.yml --limit ci-target \
              --tags packages,login_shell,overlay,tailscale,docker --skip-tags service \
              -e '{"docker_users": ["root"]}'
          }
          run
          run | tee second.log
          grep -E 'changed=0 +unreachable=0 +failed=0' second.log

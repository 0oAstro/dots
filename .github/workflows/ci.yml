name: ci
on:
  push:
  pull_request:

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: sudo apt-get install -y zsh
        if: runner.os == 'Linux'
      - run: mise run smoke
      - run: shellcheck --severity=warning install.sh tests/*.sh
      - run: gitleaks dir --no-banner --redact .
        if: runner.os == 'Linux'

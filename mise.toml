# Tasks for working on this repo (run `mise trust` once in the checkout).
[tools]
chezmoi = "latest"
shellcheck = "latest"
shfmt = "latest"
gitleaks = "latest"
actionlint = "latest"
python = "3.14"
uv = "latest" # the pipx backend installs ansible-core with uvx
"pipx:ansible-core" = "latest"

[tasks.fmt]
description = "Format every shell script, chezmoi templates included"
run = "tests/fmt.py"

[tasks."ansible:deps"]
description = "Install the Ansible collections into ansible/collections"
dir = "ansible"
# Galaxy drops connections now and then; retry before failing.
run = "for i in 1 2 3; do ansible-galaxy collection install -r requirements.yml -p collections && exit 0; sleep 10; done; exit 1"
sources = ["requirements.yml"]
outputs = ["collections/ansible_collections"]

[tasks.provision]
description = "Apply the system layer, then chezmoi, on every host (pass --check --diff, --limit)"
depends = ["ansible:deps"]
dir = "ansible"
run = "ansible-playbook site.yml"

[tasks.check]
description = "Format check, lint (shell, workflows), secret scan, playbook syntax, render every profile, start zsh"
depends = ["ansible:deps"]
run = [
  "tests/fmt.py --check",
  "cd ansible && ansible-playbook --syntax-check site.yml",
  "shellcheck --severity=warning install.sh tests/*.sh",
  "actionlint",
  "gitleaks dir --no-banner --redact .",
  "tests/render.sh --smoke",
]

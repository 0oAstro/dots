# What every Mac is, whatever its other modules: Homebrew (Brewfile), the
# firewall, the background agents below.
macs:
  hosts: {thunderchief: , blackbird: }
  vars:
    login_shell: /opt/homebrew/bin/zsh # Brewfile's zsh

    # The system Python: a discovered python3 may be a mise shim that fails on an
    # untrusted config.
    ansible_python_interpreter: "{{ ansible_playbook_python if ansible_connection == 'local' else '/usr/bin/python3' }}"

    macos_firewall:
      globalstate: true
      stealthmode: true
      blockall: false
      allowsigned: false
      allowsignedapp: false

    launchd_agents_macs:
      - label: dev.dots.brew-upgrade
        start_interval: 43200
        # The trailing clause moves NotProton and CrossOver together and patches
        # CrossOver again (crossover-sync, games module); other hosts skip it.
        command: >-
          /bin/date &&
          /opt/homebrew/bin/brew update &&
          /opt/homebrew/bin/brew upgrade --formula &&
          /opt/homebrew/bin/brew upgrade --cask &&
          { [ -x "$HOME/.local/bin/crossover-sync" ] && "$HOME/.local/bin/crossover-sync" || true; } &&
          /opt/homebrew/bin/brew cleanup
        env:
          HOMEBREW_NO_ENV_HINTS: "1"
          HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "1"
          PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin

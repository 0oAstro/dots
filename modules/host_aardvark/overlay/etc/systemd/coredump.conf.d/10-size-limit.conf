# A crashed process with GBs of heap (the Vercel CLI hitting node's heap limit)
# meant xz-compressing a ~1G core at a few MB/s. That outran systemd-coredump's
# 5 min runtime limit and left a failed systemd-coredump@ unit. Nobody reads
# cores on this host, so log the crash (and a stack trace when small) to the
# journal and store nothing.
[Coredump]
Storage=none
ProcessSizeMax=1G

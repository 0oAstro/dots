# What every Linux host is: base packages, zsh, the overlay/ files.
linux:
  children: {servers: }
  vars:
    # System python: dnf and firewalld bindings live there, not in mise's.
    ansible_python_interpreter: /usr/bin/python3

    # Lists named packages_* or systemd_enabled_* in any module are merged.
    packages_linux:
      - sudo
      - zsh
      - git
      - unzip
      - tar
    # mise builds its cargo: tools from source.
    packages_linux_build: [gcc, gcc-c++, make, pkgconf, zlib-devel, openssl-devel]

    login_shell: /bin/zsh

# Dropbox through Maestral's daemon, without its menu-bar app (roles/maestral).
# Sign in once: maestral-cli auth link -c maestral; the token stays in the
# Keychain. Every key below is applied with maestral-cli and checked each run.
dropbox:
  hosts: {thunderchief: }
  vars:
    maestral_name: maestral
    maestral_cli: /Applications/Maestral.app/Contents/MacOS/maestral-cli
    maestral_folder: "{{ ansible_facts.env.HOME }}/Dropbox"
    maestral_config:
      max_cpu_percent: 20.0 # per core; Maestral throttles indexing to this
      keep_history: 604800 # a week of sync history
      notification_level: 15 # 10 debug, 15 syncing errors and conflicts, 30 errors
      log_level: 20
      upload: true
      download: true
    maestral_bandwidth: {up: 0, down: 0} # MB/s, 0 = unlimited
    maestral_excluded: [] # Dropbox paths left out of selective sync, e.g. /Archive

    launchd_agents_dropbox:
      - label: com.samschott.maestral.maestral
        keep_alive: true
        background: true # Nice 10, low-priority I/O
        command: exec {{ maestral_cli }} start --foreground --config-name {{ maestral_name }}
        env:
          LC_CTYPE: UTF-8
          PYTHONOPTIMIZE: "2"

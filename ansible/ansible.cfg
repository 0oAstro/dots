[defaults]
# Every modules/<name>/module.yml is an inventory file: the module's group,
# its hosts and its vars. Only those files count as inventory.
inventory = ../modules
inventory_ignore_patterns = ^(Brewfile|overlay|user_units)$
collections_path = collections
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
inject_facts_as_vars = false

[inventory]
enable_plugins = yaml

[ssh_connection]
pipelining = true

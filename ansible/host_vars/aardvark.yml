# Amazon Linux 2023, arm64 EC2 (ap-south-1). SSH arrives over Tailscale only:
# the security group has no public SSH. Files: files/overlays/aardvark/.

packages_aardvark:
  - spal-release # Amazon's extra repo: mosh, chromium, ffmpeg, tesseract, poppler-utils
  - firewalld
  - rclone
  - fuse3
  - ethtool
  - nfs-utils
  - dnf-automatic
  - sysstat
  - mosh
  - jq
  - fio
  - chromium
  - ffmpeg
  - tesseract
  - poppler-utils

systemd_enabled_aardvark:
  - nfs-server.service
  - dnf-automatic.timer
  - tailscale-udp-gro.service
  - rclone-dropbox.service
  - rclone-gdrive.service

# Restarted when their unit, drop-in or (for stack units) repo copy changes.
# Left out: the rclone mounts, because containers hold files open on them.
systemd_restart_on_change:
  - tailscale-udp-gro.service
  - algochat-ads-monitor.timer
  - beszel-status.timer
  - claude-usage.timer
  - cloudflare-ip-sync.timer
  - docker-backup-status.timer
  - docker-backup.timer
  - ebs-cloudwatch-exporter.timer

docker_users: [ec2-user]

docker_stacks_repo: https://github.com/0oAstro/aardvark-docker.git
docker_stacks_dir: /opt/docker
docker_stacks_owner: ec2-user
# Units the stacks own, by repo path; installed to /etc/systemd/system.
# Timers are enabled; their oneshot services stay static.
docker_stacks_units:
  - backup/docker-backup.service
  - backup/docker-backup.timer
  - caddy/systemd/cloudflare-ip-sync.service
  - caddy/systemd/cloudflare-ip-sync.timer
  - glance/ops/beszel-status.service
  - glance/ops/beszel-status.timer
  - glance/ops/claude-usage.service
  - glance/ops/claude-usage.timer
  - glance/ops/docker-backup-status.service
  - glance/ops/docker-backup-status.timer
  - prometheus/systemd/algochat-ads-monitor.service
  - prometheus/systemd/algochat-ads-monitor.timer
  - prometheus/systemd/ebs-cloudwatch-exporter.service
  - prometheus/systemd/ebs-cloudwatch-exporter.timer

# docker-backup's pinned tools (backup/README.md).
backup_tools_dir: /usr/local/lib/docker-backup
backup_tools_restic_version: 0.19.1
backup_tools_rclone_version: 1.75.1
backup_tools_python: /home/ec2-user/.local/share/mise/installs/python/3.14/bin/python3

firewalld_default_zone: public
# Each zone's services, ports and rich rules are exclusive: extras get removed.
# The docker zone is docker's own and stays unmanaged.
firewalld_zones:
  public:
    target: DROP
    interfaces: [ens34]
    forward: true
    masquerade: false
    services: [dhcpv6-client, ssh]
    ports:
      - 80/tcp
      - 443/tcp
      - 443/udp
      - 25565/tcp # minecraft
      - 41641/udp # tailscale direct
      - 60000-61000/udp # mosh
    rich_rules:
      # Exit-node traffic from the tailnet leaves through ens34.
      - rule family="ipv4" source address="100.64.0.0/10" masquerade
      - rule family="ipv6" source address="fd7a:115c:a1e0::/48" masquerade
  trusted:
    interfaces: [tailscale0]
    forward: true
    services: []
    ports: []
    rich_rules: []

# Concatenated: <group>.Brewfile for each group the host is in (macs plus
# its modules), then the host's own. Missing files are skipped.
homebrew_brewfile_srcs: "{{ group_names | map('regex_replace', '^(.*)$', 'brewfiles/\\1.Brewfile') | list + ['brewfiles/' ~ inventory_hostname ~ '.Brewfile'] }}"

login_shell: /opt/homebrew/bin/zsh # Brewfile's zsh

# The system Python: a discovered python3 may be a mise shim that fails on an
# untrusted config.
ansible_python_interpreter: "{{ ansible_playbook_python if ansible_connection == 'local' else '/usr/bin/python3' }}"

# What every Mac is, whatever its modules: Homebrew, firewall, the background
# agents below. Look, input, Finder and the rest are modules (inventory.yml).

# Taps Homebrew keeps but no Brewfile needs. homebrew/core is a 1.5 GB clone
# that Homebrew stopped reading in 4.0 (it installs from its JSON API).
homebrew_untap:
  - homebrew/core
  - homebrew/cask

macos_firewall:
  globalstate: true
  stealthmode: true
  blockall: false
  allowsigned: false
  allowsignedapp: false

# Replaces the domt4/homebrew-autoupdate agent (its tap is gone).
launchd_agents_macs:
  - label: dev.dots.brew-upgrade
    start_interval: 43200
    # The trailing clause moves NotProton and CrossOver together and patches
    # CrossOver again (crossover-sync, games module); other hosts skip it.
    command: >-
      /bin/date &&
      /opt/homebrew/bin/brew update &&
      /opt/homebrew/bin/brew upgrade --formula &&
      /opt/homebrew/bin/brew upgrade --cask &&
      { [ -x "$HOME/.local/bin/crossover-sync" ] && "$HOME/.local/bin/crossover-sync" || true; } &&
      /opt/homebrew/bin/brew cleanup
    env:
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "1"
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
  # Same proxy as the servers' bifrost-mitm.service; see ai-gateway.zsh.
  - label: dev.dots.bifrost-mitm
    keep_alive: true
    command: >-
      exec "$HOME/.local/share/mise/installs/pipx-mitmproxy/latest/bin/mitmdump" --listen-host 127.0.0.1 --listen-port 18899
      --allow-hosts '^api\.anthropic\.com(:443)?$'
      --set stream_large_bodies=64m --set flow_detail=0 --set termlog_verbosity=warn
      -s "$HOME/.config/bifrost-mitm/addon.py"
launchd_agents_absent:
  - label: com.github.domt4.homebrew-autoupdate
    files:
      - "~/Library/Application Support/com.github.domt4.homebrew-autoupdate"
      - "~/Library/Logs/com.github.domt4.homebrew-autoupdate"

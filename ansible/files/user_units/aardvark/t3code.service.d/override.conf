[Unit]
# docker0 may not exist yet when the user manager starts at boot; keep retrying.
StartLimitIntervalSec=0

[Service]
# Cap t3 and the agent sessions it spawns so a runaway OOM-kills inside this cgroup instead of swap-locking the host.
MemoryHigh=10G
MemoryMax=12G
MemorySwapMax=0
# All interfaces: the T3 Connect tunnel reaches it on 127.0.0.1, and Caddy (t3.shau.me, behind Pocket ID) on 172.28.0.1 from its pinned auth_net address.
# The firewalld direct rules in overlays/aardvark/etc/firewalld/direct.xml reject 3773 from every other source, the tailnet included.
Environment=T3CODE_HOST=0.0.0.0
Environment=T3CODE_PORT=3773

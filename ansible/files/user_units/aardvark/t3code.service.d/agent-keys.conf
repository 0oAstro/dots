[Service]
# Agents that T3 starts read the Azure pair for the GPT, GLM and DeepSeek
# deployments, and AWS_PROFILE for Claude and Kimi K3 on Bedrock. systemd
# can't parse the zsh `export` lines, so copy just those keys to a runtime env file.
ExecStartPre=/bin/sh -c 'umask 077; sed -n "s/^export \\(\\(AZURE_OPENAI_API_KEY\\|AZURE_OPENAI_BASE_URL\\)=\\)/\\1/p" %h/.config/zsh/.zshrc.local > %t/t3code.env'
Environment=AWS_PROFILE=personal AWS_REGION=us-east-1
EnvironmentFile=-%t/t3code.env

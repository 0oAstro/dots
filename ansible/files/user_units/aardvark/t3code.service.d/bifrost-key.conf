[Service]
# Agents that T3 starts read BIFROST_VIRTUAL_KEY for Bifrost.
# systemd can't parse the zsh `export` lines, so copy just that key to a runtime env file.
ExecStartPre=/bin/sh -c 'umask 077; sed -n "s/^export \\(BIFROST_VIRTUAL_KEY=\\)/\\1/p" %h/.config/zsh/.zshrc.local > %t/t3code.env'
EnvironmentFile=-%t/t3code.env

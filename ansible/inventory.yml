# Hosts by kind. Groups carry the shared settings (group_vars/), hosts add
# their own (host_vars/<host>.yml, files/overlays/<host>/). SSH settings come
# from ~/.ssh/config. Whichever host runs the playbook connects to itself
# locally (group_vars/all.yml), so any machine can be the controller.
all:
  children:
    macs:
      hosts:
        thunderchief:
    linux:
      children:
        servers:
          hosts:
            aardvark:
        desktops:
          hosts: {}

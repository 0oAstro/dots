# Hosts by kind, then by module. A kind (macs, linux, servers, desktops) is
# what a machine is; a module is one feature, with its settings in
# group_vars/<module>.yml and, on a Mac, files/brewfiles/<module>.Brewfile.
# Shared modules take every Mac (children: macs); opt-in modules list hosts.
# Personal choices (appearance, power, screenshot folder) stay in
# host_vars/<host>.yml. SSH settings come from ~/.ssh/config. Whichever host
# runs the playbook connects to itself locally (group_vars/all.yml).
all:
  children:
    macs:
      hosts:
        thunderchief: # Shaurya
        blackbird: # Hemant
    linux:
      children:
        servers:
          hosts:
            aardvark:
        desktops:
          hosts: {}

    # Shared modules: every Mac.
    look: {children: {macs: {}}} # appearance, Dock, menu bar, desktop
    input: {children: {macs: {}}} # keyboard, text, trackpad, Karabiner
    finder: {children: {macs: {}}} # Finder, .DS_Store, screenshots
    perf: {children: {macs: {}}} # login items, power, crash dialogs
    vendor_updaters_off: {children: {macs: {}}} # Google and Zoom updaters
    ai_off: {children: {macs: {}}} # Apple Intelligence, Siri, dictation

    # Opt-in modules.
    apps_dev: # Xcode, Cursor, T3 Code, TestFlight
      hosts: {thunderchief: , blackbird: }
    apps_comms: # Slack, WhatsApp
      hosts: {thunderchief: , blackbird: }
    apps_media: # IINA
      hosts: {thunderchief: , blackbird: }
    games: # Steam, CrossOver 26.3 (cmas.sh), NotProton, Prism Launcher, Game Center
      hosts: {thunderchief: }
    google_drive: # the Drive app, ~/Drive
      hosts: {thunderchief: }
    dropbox: # Maestral without its menu-bar app, syncing ~/Dropbox
      hosts: {thunderchief: }

    # Agent harnesses, one group each: harness_<name> gives the host
    # ~/.config/mise/conf.d/harness-<name>.toml and the harness's settings
    # (home/.chezmoiignore lists its paths). Add or remove a host here.
    harness_claude:
      hosts: {thunderchief: , blackbird: , aardvark: }
    harness_pi:
      hosts: {thunderchief: , blackbird: , aardvark: }
    harness_hermes:
      hosts: {thunderchief: , blackbird: , aardvark: }
    harness_prime:
      hosts: {aardvark: }
    harness_cursor:
      hosts: {aardvark: }

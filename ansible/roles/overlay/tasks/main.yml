# Copies files/overlays/<layer>/ onto / for each layer in overlay_layers.
# A later layer wins for the same path. Existing directories keep their modes.
- name: Collect overlay files
  ansible.builtin.set_fact:
    overlay_files: >-
      {{ overlay_files | default({}) | combine(
           query('community.general.filetree', playbook_dir ~ '/files/overlays/' ~ item)
           | selectattr('state', 'eq', 'file')
           | items2dict(key_name='path', value_name='src')) }}
  loop: "{{ overlay_layers }}"

- name: Is sshd installed?
  ansible.builtin.stat:
    path: /usr/sbin/sshd
  register: overlay_sshd

- name: Skip sshd settings where there is no sshd
  ansible.builtin.set_fact:
    overlay_files: "{{ overlay_files | dict2items | rejectattr('key', 'match', 'etc/ssh/') | items2dict }}"
  when: not overlay_sshd.stat.exists

- name: Parent directories
  ansible.builtin.file:
    path: "/{{ item }}"
    state: directory
  loop: "{{ overlay_files.keys() | map('dirname') | unique | sort }}"

- name: Files
  ansible.builtin.copy:
    src: "{{ item.value }}"
    dest: "/{{ item.key }}"
    owner: root
    group: root
    mode: "{{ overlay_modes['/' ~ item.key] | default('0644') }}"
    # Debian's sshd -t needs /run/sshd, which only exists while sshd runs.
    validate: "{{ 'sh -c \"mkdir -p /run/sshd && exec /usr/sbin/sshd -t -f $0\" %s' if item.key.startswith('etc/ssh/') else omit }}"
  loop: "{{ overlay_files | dict2items }}"
  loop_control:
    label: "/{{ item.key }}"
  register: overlay_copied

- name: Remember what changed
  ansible.builtin.set_fact:
    overlay_changed: "{{ overlay_copied.results | selectattr('changed') | map(attribute='item.key') | map('regex_replace', '^', '/') | list }}"

- name: Load kernel modules
  ansible.builtin.command: systemctl restart systemd-modules-load
  when: overlay_changed | select('match', '/etc/modules-load.d/') | list | length > 0
  changed_when: true

- name: Apply udev rules
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=block --action=change
  when: overlay_changed | select('match', '/etc/udev/rules.d/') | list | length > 0
  changed_when: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  when: overlay_changed | select('match', '/etc/sysctl.d/') | list | length > 0
  changed_when: true

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: overlay_changed | select('match', '/etc/systemd/system/') | list | length > 0

- name: Restart systemd-oomd
  ansible.builtin.systemd_service:
    name: systemd-oomd
    state: restarted
  when: overlay_changed | select('match', '/etc/systemd/oomd.conf.d/') | list | length > 0

- name: Apply tmpfiles
  ansible.builtin.command: systemd-tmpfiles --create
  when: overlay_changed | select('match', '/etc/tmpfiles.d/') | list | length > 0
  changed_when: true

- name: Start zram swap
  ansible.builtin.systemd_service:
    name: systemd-zram-setup@zram0
    state: restarted
    daemon_reload: true
  when: overlay_changed | select('match', '/etc/systemd/zram-generator.conf') | list | length > 0

- name: Re-export NFS
  ansible.builtin.command: exportfs -ra
  when: overlay_changed | select('match', '/etc/exports') | list | length > 0
  changed_when: true

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
    state: reloaded
  tags: [service]
  when: overlay_changed | select('match', '/etc/ssh/') | list | length > 0

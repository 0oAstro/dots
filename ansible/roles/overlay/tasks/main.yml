# Copies modules/<module>/overlay/ onto / for each module the host is in.
# Two modules may not write the same path. Existing directories keep their modes.
- name: Collect overlay files
  ansible.builtin.set_fact:
    overlay_files: >-
      {{ overlay_files | default({}) | combine(
           query('community.general.filetree', modules_dir ~ '/' ~ item ~ '/overlay')
           | selectattr('state', 'eq', 'file')
           | items2dict(key_name='path', value_name='src')) }}
    overlay_paths: >-
      {{ overlay_paths | default([]) +
         query('community.general.filetree', modules_dir ~ '/' ~ item ~ '/overlay')
         | selectattr('state', 'eq', 'file') | map(attribute='path') | list }}
  loop: "{{ group_names }}"

- name: One module per path
  ansible.builtin.assert:
    that: overlay_paths | length == overlay_paths | unique | length
    fail_msg: "Written by two modules: {{ overlay_paths | community.general.counter | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
    quiet: true

- name: Parent directories
  ansible.builtin.file:
    path: "/{{ item }}"
    state: directory
  loop: "{{ overlay_files.keys() | map('dirname') | unique | sort }}"

- name: Files
  ansible.builtin.copy:
    src: "{{ item.value }}"
    dest: "/{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ overlay_files | dict2items }}"
  loop_control:
    label: "/{{ item.key }}"
  register: overlay_copied

- name: Remember what changed
  ansible.builtin.set_fact:
    overlay_changed: "{{ overlay_copied.results | selectattr('changed') | map(attribute='item.key') | map('regex_replace', '^', '/') | list }}"

- name: Load kernel modules
  ansible.builtin.command: systemctl restart systemd-modules-load
  when: overlay_changed | select('match', '/etc/modules-load.d/') | list | length > 0
  changed_when: true

- name: Apply udev rules
  ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=block --action=change
  when: overlay_changed | select('match', '/etc/udev/rules.d/') | list | length > 0
  changed_when: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  when: overlay_changed | select('match', '/etc/sysctl.d/') | list | length > 0
  changed_when: true

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: overlay_changed | select('match', '/etc/systemd/system/') | list | length > 0

- name: Restart systemd-oomd
  ansible.builtin.systemd_service:
    name: systemd-oomd
    state: restarted
  when: overlay_changed | select('match', '/etc/systemd/oomd.conf.d/') | list | length > 0

- name: Apply tmpfiles
  ansible.builtin.command: systemd-tmpfiles --create
  when: overlay_changed | select('match', '/etc/tmpfiles.d/') | list | length > 0
  changed_when: true

- name: Start zram swap
  ansible.builtin.systemd_service:
    name: systemd-zram-setup@zram0
    state: restarted
    daemon_reload: true
  when: overlay_changed | select('match', '/etc/systemd/zram-generator.conf') | list | length > 0

- name: Rebuild the CA trust store
  ansible.builtin.command: update-ca-trust extract
  when: overlay_changed | select('match', '/etc/pki/ca-trust/source/') | list | length > 0
  changed_when: true

- name: Reload firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: reloaded
  tags: [service]
  when: overlay_changed | select('match', '/etc/firewalld/') | list | length > 0

# Rex package (docs: superlogical.com/rex/docs/linux). The server runs as the
# login user from the user_units role (rex-server.service) with built-in Tailscale.
- name: Repo file
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/rex.repo
    mode: "0644"
    content: |
      [rex]
      name=Rex ({{ rex_channel }})
      baseurl=https://pkgs.superlogical.com/rex/rpm/{{ rex_channel }}/$basearch
      enabled=1
      gpgcheck=1
      repo_gpgcheck=1
      gpgkey=https://pkgs.superlogical.com/rex/keys/rex.asc

- name: Signing key
  ansible.builtin.rpm_key:
    key: https://pkgs.superlogical.com/rex/keys/rex.asc

- name: Trust the repo metadata key
  ansible.builtin.command: dnf -y -q --repo rex makecache
  changed_when: false

- name: Package
  ansible.builtin.package:
    name: rex
    state: present

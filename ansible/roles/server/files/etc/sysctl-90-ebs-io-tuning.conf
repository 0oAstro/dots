# EBS I/O optimization: smaller dirty page windows prevent writeback bursts
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2
vm.dirty_expire_centisecs = 1500

# Low swappiness: prefer dropping caches over swapping to EBS
vm.swappiness = 10

# Keep inode/dentry caches longer (benefits rclone FUSE mounts)
vm.vfs_cache_pressure = 50

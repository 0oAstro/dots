# Writes secrets from a repo's sealed/ copies (age, decrypted by chezmoi).
#   secrets_repo_dir: repo holding secrets.yml and sealed/<path>.age
# Missing files are created. A live file that differs from its sealed copy
# fails the run (run bin/seal in the repo to keep the live one), unless the
# entry has seed: true (its app rotates it) or you pass -e secrets_take_sealed=true.
- name: Read the manifest
  ansible.builtin.slurp:
    src: "{{ secrets_repo_dir }}/secrets.yml"
  register: secrets_manifest_raw

- name: Parse the manifest
  ansible.builtin.set_fact:
    secrets_manifest: "{{ secrets_manifest_raw.content | b64decode | from_yaml }}"

- name: Private scratch directory
  ansible.builtin.tempfile:
    state: directory
    suffix: .secrets
  register: secrets_tmp
  changed_when: false
  check_mode: false

- name: Decrypt, compare and write
  block:
    - name: Decrypt sealed copies
      ansible.builtin.command: "{{ dots_chezmoi }} decrypt --output {{ secrets_tmp.path }}/{{ idx }} {{ secrets_repo_dir }}/sealed{{ item.path }}.age"
      loop: "{{ secrets_manifest }}"
      loop_control:
        index_var: idx
        label: "{{ item.path }}"
      changed_when: false
      check_mode: false
      environment: "{{ dots_env }}"

    - name: Checksum the sealed copies
      ansible.builtin.stat:
        path: "{{ secrets_tmp.path }}/{{ idx }}"
        get_mime: false
      loop: "{{ secrets_manifest }}"
      loop_control:
        index_var: idx
        label: "{{ item.path }}"
      register: secrets_want

    - name: Checksum the live files
      ansible.builtin.stat:
        path: "{{ item.path }}"
        get_mime: false
      loop: "{{ secrets_manifest }}"
      loop_control:
        label: "{{ item.path }}"
      register: secrets_live
      become: true

    - name: Classify
      ansible.builtin.set_fact:
        secrets_state: >-
          {%- set out = [] -%}
          {%- for s in secrets_manifest -%}
          {%-   set live = secrets_live.results[loop.index0].stat -%}
          {%-   set want = secrets_want.results[loop.index0].stat -%}
          {%-   set _ = out.append(s | combine({'idx': loop.index0, 'seed': s.seed | default(false),
                  'state': 'missing' if not live.exists else ('same' if live.checksum == want.checksum else 'differs')})) -%}
          {%- endfor -%}
          {{ out }}

    - name: Live secrets that were changed but not sealed
      ansible.builtin.fail:
        msg: >-
          These differ from their sealed copies: {{ secrets_unsealed | join(', ') }}.
          To keep the live files, run bin/seal in {{ secrets_repo_dir }} and commit.
          To restore the sealed ones, rerun with -e secrets_take_sealed=true.
      vars:
        secrets_unsealed: "{{ secrets_state | selectattr('state', 'eq', 'differs') | rejectattr('seed') | map(attribute='path') | list }}"
      when: secrets_unsealed | length > 0 and not (secrets_take_sealed | default(false) | bool)

    - name: Rotated by their apps (expected; bin/seal refreshes the copies)
      ansible.builtin.debug:
        msg: "{{ secrets_state | selectattr('state', 'eq', 'differs') | selectattr('seed') | map(attribute='path') | list }}"
      when: secrets_state | selectattr('state', 'eq', 'differs') | selectattr('seed') | list | length > 0

    - name: Parent directories of missing secrets
      ansible.builtin.file:
        path: "{{ item.path | dirname }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "0700"
      loop: "{{ secrets_state | selectattr('state', 'eq', 'missing') | list }}"
      loop_control:
        label: "{{ item.path | dirname }}"
      become: true

    - name: Write secrets
      ansible.builtin.copy:
        src: "{{ secrets_tmp.path }}/{{ item.idx }}"
        dest: "{{ item.path }}"
        remote_src: true
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: >-
        {{ secrets_state | selectattr('state', 'eq', 'missing') | list
           + (secrets_state | selectattr('state', 'eq', 'differs') | rejectattr('seed') | list
              if secrets_take_sealed | default(false) | bool else []) }}
      loop_control:
        label: "{{ item.path }}"
      become: true

    - name: Ownership and modes
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: "{{ secrets_state | rejectattr('state', 'eq', 'missing') | list }}"
      loop_control:
        label: "{{ item.path }}"
      become: true
  always:
    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ secrets_tmp.path }}"
        state: absent
      changed_when: false
      check_mode: false

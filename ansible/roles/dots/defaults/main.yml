dots_repo: 0oAstro/dots
# Every module the host is in: chezmoi sees them as .modules.
dots_prompt_args: "--no-tty --promptString modules={{ group_names | sort | join(',') }}"
dots_controller_age_key: "{{ lookup('ansible.builtin.file', '~/.config/age/keys.txt', errors='ignore') | default('', true) }}"

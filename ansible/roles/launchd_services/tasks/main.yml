# launchd's enable/disable flags, per user (gui/<uid>) and system-wide. The
# flag survives reboots; macOS updates can reset it, and the next run puts it
# back. Listing a label as enabled undoes an earlier disable.
- name: One state per label
  ansible.builtin.assert:
    that: services_all | map(attribute='label') | list | length == services_all | map(attribute='label') | unique | list | length
    fail_msg: "Listed twice: {{ services_all | map(attribute='label') | list | community.general.counter | dict2items | selectattr('value', '>', 1) | map(attribute='key') | list }}"
    quiet: true

- name: Per-user flags now
  ansible.builtin.command: launchctl print-disabled gui/{{ ansible_facts.user_uid }}
  register: services_gui_now
  changed_when: false
  check_mode: false

- name: System flags now
  ansible.builtin.command: launchctl print-disabled system
  register: services_system_now
  changed_when: false
  check_mode: false
  become: true

- name: Per-user services
  ansible.builtin.command: launchctl {{ item.state | regex_replace('d$', '') }} gui/{{ ansible_facts.user_uid }}/{{ item.label }}
  loop: "{{ services_gui }}"
  loop_control:
    label: "{{ item.label }} {{ item.state }}"
  when: >-
    (item.state == 'disabled') != (('"' ~ item.label ~ '" => disabled') in services_gui_now.stdout)
  changed_when: true

- name: System services
  ansible.builtin.command: launchctl {{ item.state | regex_replace('d$', '') }} system/{{ item.label }}
  loop: "{{ services_system }}"
  loop_control:
    label: "{{ item.label }} {{ item.state }}"
  when: >-
    (item.state == 'disabled') != (('"' ~ item.label ~ '" => disabled') in services_system_now.stdout)
  changed_when: true
  become: true

- name: Hand-made daemons removed
  ansible.builtin.shell: |
    plist=/Library/LaunchDaemons/{{ item }}.plist
    [ -e "$plist" ] || exit 0
    launchctl bootout system/{{ item }} 2>/dev/null || true
    launchctl enable system/{{ item }}
    rm -f "$plist"
    echo removed
  loop: "{{ daemons_absent }}"
  register: services_removed
  changed_when: "'removed' in services_removed.stdout"
  become: true

# The Brewfile is the whole truth: missing entries get installed, anything
# else (formulae, casks, taps) gets uninstalled. Upgrades run from the
# dev.dots.brew-upgrade launchd agent.
- name: Homebrew
  # The installer refuses root and calls sudo itself, so on a Mac without
  # passwordless sudo install.sh runs it interactively before Ansible.
  ansible.builtin.shell: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    creates: "{{ homebrew_bin }}"

- name: Brewfile directory
  ansible.builtin.file:
    path: "{{ homebrew_brewfile | dirname }}"
    state: directory
    mode: "0755"

- name: Brewfile
  ansible.builtin.copy:
    src: "{{ homebrew_brewfile_src }}"
    dest: "{{ homebrew_brewfile }}"
    mode: "0644"

- name: Check the Brewfile
  ansible.builtin.command: "{{ homebrew_bin }} bundle check --no-upgrade --file={{ homebrew_brewfile }}"
  register: homebrew_check
  changed_when: ansible_check_mode and homebrew_check.rc != 0
  failed_when: homebrew_check.rc not in [0, 1]
  check_mode: false
  environment: "{{ homebrew_env }}"

- name: Install what is missing
  ansible.builtin.command: "{{ homebrew_bin }} bundle install --no-upgrade --file={{ homebrew_brewfile }}"
  when: homebrew_check.rc != 0
  changed_when: true
  environment: "{{ homebrew_env }}"

- name: Find what the Brewfile does not list
  ansible.builtin.command: "{{ homebrew_bin }} bundle cleanup --file={{ homebrew_brewfile }}"
  register: homebrew_extra
  changed_when: ansible_check_mode and homebrew_extra.stdout | trim | length > 0
  failed_when: false
  check_mode: false
  environment: "{{ homebrew_env }}"

- name: Uninstall it
  ansible.builtin.command: "{{ homebrew_bin }} bundle cleanup --force --file={{ homebrew_brewfile }}"
  when: homebrew_extra.stdout | trim | length > 0
  changed_when: true
  environment: "{{ homebrew_env }}"

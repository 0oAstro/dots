homebrew_bin: /opt/homebrew/bin/brew
homebrew_brewfile: "{{ ansible_facts.env.HOME }}/.config/homebrew/Brewfile"
# Concatenated: the Brewfile of every module the host is in. Modules without one are skipped.
homebrew_brewfile_srcs: "{{ group_names | map('regex_replace', '^(.*)$', modules_dir ~ '/\\1/Brewfile') | list }}"
homebrew_env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

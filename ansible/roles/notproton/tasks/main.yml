# NotProton (github.com/NotProtonNot/NotProton) comes from its own cask
# (games.Brewfile). Patching Steam stays in the app: open it and click Patch
# once, and again after Steam or CrossOver updates.
- name: Quarantined?
  ansible.builtin.command: xattr -p com.apple.quarantine "{{ notproton_app }}"
  register: notproton_quarantine
  changed_when: false
  failed_when: false
  check_mode: false

- name: Clear the quarantine flag
  ansible.builtin.command: xattr -dr com.apple.quarantine "{{ notproton_app }}"
  when: notproton_quarantine.rc == 0
  changed_when: true

- name: Steam patched?
  ansible.builtin.command: /usr/libexec/PlistBuddy -c "Print :LSEnvironment:DYLD_INSERT_LIBRARIES" /Applications/Steam.app/Contents/Info.plist
  register: notproton_steam
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say so
  ansible.builtin.debug:
    msg: Steam is not patched. Open NotProton and click Patch.
  when: notproton_steam.rc != 0

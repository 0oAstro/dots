# CrossOver and NotProton come from games.Brewfile. crossover-sync (chezmoi,
# ~/.local/bin) upgrades NotProton, moves CrossOver to Homebrew's release only
# when NotProton supports that build, then patches CrossOver with cmas.sh. The
# dev.dots.brew-upgrade agent runs the same script twice a day. cmas.sh is
# age-encrypted: without the age key it is missing and this role fails.
# Patching Steam stays in NotProton: open it and click Patch once, and again
# after Steam or CrossOver updates.
- name: Sync CrossOver with NotProton
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/crossover-sync"
  register: crossover_sync
  when: not ansible_check_mode # it upgrades casks and patches the app
  changed_when: >-
    crossover_sync.stdout_lines | select('match', '^(changed: |patched$)') | list | length > 0

- name: Say what is held back
  ansible.builtin.debug:
    msg: "{{ crossover_held }}"
  when: crossover_sync.stdout_lines is defined and crossover_held | length > 0
  vars:
    crossover_held: "{{ crossover_sync.stdout_lines | select('match', '^held: ') | list }}"

- name: Steam patched?
  ansible.builtin.command: /usr/libexec/PlistBuddy -c "Print :LSEnvironment:DYLD_INSERT_LIBRARIES" /Applications/Steam.app/Contents/Info.plist
  register: notproton_steam
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say Steam needs patching
  ansible.builtin.debug:
    msg: Steam is not patched. Open NotProton and click Patch.
  when: notproton_steam.rc != 0
